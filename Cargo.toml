[package]
name = "blackhole"
version = "0.1.0"
edition = "2021"
description = "Animacion de un agujero negro por raymarching en CPU - Proyecto 2, Graficas por Computadora"

[dependencies]
minifb = "0.28"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# La matematica y el render son propios: optimizarlos tambien en desarrollo.
# Para medir rendimiento y presentar el proyecto, usar siempre --release.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
