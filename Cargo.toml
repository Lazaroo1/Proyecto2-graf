[package]
name = "blackhole"
version = "0.1.0"
edition = "2021"
description = "Animacion de un agujero negro por raymarching en CPU - Proyecto 2, Graficas por Computadora"

[dependencies]
minifb = "0.28"
rayon = "1.10"
glam = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# El raymarch en debug es inusable: aun con `cargo run` (sin --release) queremos
# que las dependencias matematicas esten optimizadas.
[profile.dev.package."*"]
opt-level = 3
